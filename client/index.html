<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no"
    />

    <meta name="theme-color" content="#1F6B4F" />

    <meta
      name="description"
      content="FYNDO connects people with trusted local workers and service providers for agriculture, home, repair, rental, labour and other everyday needs."
    />

    <meta
      name="robots"
      content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
    />

    <link
      rel="canonical"
      href="https://fyndoin.com/"
    />

    <link
      rel="icon"
      type="image/png"
      href="/favicon.png"
    />

    <!-- Open Graph -->
    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:site_name"
      content="FYNDO"
    />

    <meta
      property="og:title"
      content="FYNDO - Local Jobs & Services Near You"
    />

    <meta
      property="og:description"
      content="Find local workers and services near you. FYNDO connects people with skilled workers for agriculture, home, repair, rental, labour and more."
    />

    <meta
      property="og:url"
      content="https://fyndoin.com/"
    />

    <meta
      property="og:image"
      content="https://fyndoin.com/fyndo-logo.png"
    />

    <!-- Twitter / X -->
    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="FYNDO - Local Jobs & Services Near You"
    />

    <meta
      name="twitter:description"
      content="Find local workers and services near you with FYNDO."
    />

    <meta
      name="twitter:image"
      content="https://fyndoin.com/fyndo-logo.png"
    />

    <!-- Organization structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "FYNDO",
        "url": "https://fyndoin.com/",
        "logo": "https://fyndoin.com/fyndo-logo.png"
      }
    </script>

    <!-- Website structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "FYNDO",
        "url": "https://fyndoin.com/"
      }
    </script>

    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />

    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />

    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap"
      rel="stylesheet"
    />

    <title>
      FYNDO - Local Jobs & Services Near You
    </title>
  </head>

  <body>
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.tsx"
    ></script>
  </body>
</html>
